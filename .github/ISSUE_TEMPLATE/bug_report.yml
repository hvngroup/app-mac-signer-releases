name: Báo lỗi
description: Có chức năng không chạy đúng như mong đợi
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn anh/chị đã báo lỗi. **Không dán PIN, mật khẩu, tệp `.p12`/`.pfx`, khoá bí mật hay tài liệu thật vào đây.**
        Lỗ hổng bảo mật: gửi riêng qua [Security Advisories](https://github.com/hvngroup/app-mac-signer-releases/security/advisories/new) hoặc kythuat@hvn.vn, không mở issue công khai.
  - type: textarea
    id: what
    attributes:
      label: Chuyện gì đã xảy ra?
      description: Và anh/chị mong đợi điều gì?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      placeholder: |
        1. Mở Ký tài liệu
        2. Chọn chứng thư ...
  - type: input
    id: version
    attributes:
      label: Phiên bản HVN Mac Signer
      description: Xem trong cửa sổ Giới thiệu.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Máy Mac
      options:
        - Apple silicon (M1 trở lên)
        - Intel
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Phiên bản macOS
      placeholder: "15.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Chức năng
      multiple: true
      options:
        - Ký PDF
        - Kiểm tra chữ ký
        - Chứng thư số / USB token
        - Khai thuế điện tử (ESIGN)
        - Hóa đơn điện tử (CTSigningHub)
        - Cập nhật
        - Khác
  - type: input
    id: token
    attributes:
      label: Nhà cung cấp chứng thư và loại USB token (nếu có)
      placeholder: "VNPT-CA, USB đời ..."
  - type: textarea
    id: extra
    attributes:
      label: Ảnh chụp màn hình hoặc thông tin khác
      description: Che thông tin cá nhân, mã số thuế và nội dung tài liệu trước khi đính kèm.
